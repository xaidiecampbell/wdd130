<main>
    <form>
        <div>
            <label for="fullname">Full Name</label>
            <input type="user's full name" id="fullname" name="fullname" required>
        </div>
        <div>
            <label for="email">email address</label>
            <input type="user's email address" id="email" name="email" required>
        </div>
        <div>
            <label for="quantity">Select Favorite Web Browser</label>
            <select name="favorite browser" id="browser"></select>
            <option value="1">Chrome</option>
            <option value="2">Safari</option>
            <option value="3">Firefox</option>
            </select>
        </div>
        <div>
            <label for="pet">Check the box if you have a pet.</label>
            <input type="checkbox" id="pet" name="pet">
        </div>
        <div>
            <label for="places lived">List the places you have lived</label>
            <textarea id="feedback" name="feedback" rows="4"
              placeholder="Boise, Boston, Monterey, Denver"></textarea>
        </div>
        <div>
            <button type="submit">Submit Poll</button>
        </div>

    </form>
