<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS and HTML Quiz</title>
    <meta name="description" content="This is a quiz with 4 questions about HTML and CSS">
    <meta name="author" content="Xaidie Campbell">
    <link rel="stylesheet" href="styles/quiz.css">
</head>
<header>
    <h1>CSS and HTML Quiz</h1>
</header>

<main>
    <form>
        <div>
            <label for="q1">1. What does the acronym HTML stand for?</label>
            <textarea id="q1" name="q1" rows="1" required></textarea>
        </div>
        <div>
            <label for="q2">2. How are id and class attributes selected in CSS?</label>
            <textarea id="q2" name="q2" rows="4" required></textarea>
        </div>
        <div>
            <label for="q3">3. Which of the following is a valid CSS comment?</label>
            <select name="q3" id="q3" required>
                <option value="" selected disabled>choose one</option>
                <option value="1">**</option>
                <option value="2">ctrl /</option>
                <option value="3">/* */</option>
            </select>
        </div>
        <div>
            <label for="q4">4. Correct the CSS syntax: margin; 1px.</label>
            <input type="q4" id="q4" name="q4" required>
        </div>
        <div>
            <button type="submit">Submit Quiz</button>
        </div>
    </form>

</main>

<footer>
    <h1>Quiz written by Xaidie Campbell</h1>
</footer>

</html>
